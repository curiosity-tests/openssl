  external-tests-pkcs11-provider:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
    - name: package installs
      run: |
        dnf install -y perl-FindBin perl-IPC-Cmd perl-File-Compare perl-File-Copy perl-Test-Simple perl-Test-Harness python3 make g++ perl git meson opensc expect kryoptic xxd
    - name: Prepare container for action-checkout
      # action-checkout needs bash (its Detect LFS step exits 127 without
      # it) and curl: the is_private probe shells `curl -fsSLI` and reads
      # ANY non-zero exit as "private", which routes to a private action
      # this fork cannot resolve. Ungated so both arms pay the same setup
      # cost -- an asymmetric cost between arms would bias the comparison.
      # Best-effort: it must never fail a job that builds fine without it.
      run: |
        if command -v apk >/dev/null 2>&1; then apk add --no-cache bash curl
        elif command -v microdnf >/dev/null 2>&1; then microdnf -y install bash curl
        elif command -v dnf >/dev/null 2>&1; then dnf -y install bash curl
        elif command -v yum >/dev/null 2>&1; then yum -y install bash curl
        elif command -v apt-get >/dev/null 2>&1; then apt-get -q update && apt-get -q -y install bash curl
        fi || echo "prep: package install failed, continuing"

    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false

    - name: checkout fuzz/corpora and pkcs11-provider submodule
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init --depth 1 fuzz/corpora
        git submodule update --init --depth 1 pkcs11-provider
    - name: config
      run: ./config --strict-warnings --banner=Configured --debug enable-external-tests no-fips && perl configdata.pm --dump
    - name: make
      run: make -s -j4
    # Run all tests except external tests to make sure they work fine on Fedora because
    # this is the only job running on Fedora, only then execute pkcs11-provider external
    # test.
    - name: test (except external tests)
      run: make test TESTS="-test_external_*"
    - name: test external pkcs11-provider
      run: make test TESTS="test_external_pkcs11_provider" VERBOSE=1
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
