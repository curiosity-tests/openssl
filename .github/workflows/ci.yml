  gcc-min-version:
    runs-on: ubuntu-latest
    container:
      image: docker.io/gcc:9
    timeout-minutes: 90
    strategy:
      fail-fast: false
    steps:
    - name: Prepare container for action-checkout
      # action-checkout needs bash (its Detect LFS step exits 127 without
      # it) and curl: the is_private probe shells `curl -fsSLI` and reads
      # ANY non-zero exit as "private", which routes to a private action
      # this fork cannot resolve. Ungated so both arms pay the same setup
      # cost -- an asymmetric cost between arms would bias the comparison.
      # Best-effort: it must never fail a job that builds fine without it.
      run: |
        if command -v apk >/dev/null 2>&1; then apk add --no-cache bash curl
        elif command -v microdnf >/dev/null 2>&1; then microdnf -y install bash curl
        elif command -v dnf >/dev/null 2>&1; then dnf -y install bash curl
        elif command -v yum >/dev/null 2>&1; then yum -y install bash curl
        elif command -v apt-get >/dev/null 2>&1; then apt-get -q update && apt-get -q -y install bash curl
        fi || echo "prep: package install failed, continuing"

    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false

    - name: config
      run: ./config --strict-warnings --banner=Configured enable-fips && perl configdata.pm --dump
    - name: make
      run: make -s -j4
    - name: print gcc version
      run: |
        gcc --version
    - name: get cpu info
      run: |
