# Run AVX512-specific tests under Intel SDE.
#
# GitHub Actions runners currently do not have AVX512 hardware.
# Intel SDE emulates AVX512 instructions and spoofs CPUID,
# so AVX512 code paths are exercised.
#
# To update Intel SDE: find the new mirror ID and file date from
# https://www.intel.com/content/www/us/en/download/684897
# and update the three env vars below.

name: AVX512 tests via Intel SDE

on:
  schedule:
  - cron: '30 02 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Internal: openssl-ci-bot PR number. Leave empty for a normal manual run.'
        required: false
        type: string
      head_sha:
        description: 'Internal: openssl-ci-bot commit SHA. Leave empty for a normal manual run.'
        required: false
        type: string
      check_run_id:
        description: 'Internal: openssl-ci-bot check-run ID. Leave empty for a normal manual run.'
        required: false
        type: string

# Keep in sync with openssl-ci-bot's run-name parser, and with the Actions statistics
# collector that attributes CI load by parsing this same string. Both break silently.
run-name: >-
  ${{ github.event.inputs.pr && format('ci-dispatch pr={0} head={1} check_run_id={2}', github.event.inputs.pr, github.event.inputs.head_sha, github.event.inputs.check_run_id) || github.workflow }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDE_VERSION: 10.8.0
  SDE_DATE: 2026-03-15
  SDE_MIRROR_ID: 915934

jobs:
  # Only a dispatch carries inputs, so this is skipped on the nightly cron.
  validate-dispatch-inputs:
    if: inputs.pr != '' || inputs.head_sha != '' || inputs.check_run_id != ''
    uses: ./.github/workflows/validate-dispatch-inputs.yml
    with:
      pr: ${{ inputs.pr }}
      head_sha: ${{ inputs.head_sha }}
      check_run_id: ${{ inputs.check_run_id }}

  linux:
    needs: [validate-dispatch-inputs]
    if: |
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}

    - name: install NASM
      run: sudo apt-get install -y nasm

    - name: install Intel SDE
      run: |
        SDE_URL="https://downloadmirror.intel.com/${SDE_MIRROR_ID}/sde-external-${SDE_VERSION}-${SDE_DATE}-lin.tar.xz"
        SDE_SHA256="50b320cd226acef7a491f5b321fc1be3c3c7984f9e27a456e64894b5b0979dd3"
        curl -fsSL -o /tmp/sde.tar.xz "$SDE_URL"
        echo "$SDE_SHA256  /tmp/sde.tar.xz" | sha256sum -c -
        mkdir /tmp/sde
        tar -xf /tmp/sde.tar.xz -C /tmp/sde/
        sudo mv /tmp/sde/sde-external-${SDE_VERSION}-${SDE_DATE}-lin /opt/sde
        echo "/opt/sde" >> "$GITHUB_PATH"

    - name: config
      run: |
        ./config --banner=Configured --strict-warnings no-shared enable-fips

    - name: build
      run: make -j4

    - name: show CPU and OpenSSL build info
      run: |
        cat /proc/cpuinfo | grep -m1 "model name"
        sde64 -icx -- ./apps/openssl version -c

    - name: ml_dsa_internal_test (AVX512 via SDE)
      run: sde64 -icx -- ./test/ml_dsa_internal_test

    - name: sha3_x4_internal_test (AVX512 via SDE)
      run: sde64 -icx -- ./test/sha3_x4_internal_test

    - name: fipsinstall (FIPS KAT via SDE)
      run: sde64 -icx -- ./apps/openssl fipsinstall -module ./providers/fips.so -out /tmp/fipsmodule.cnf -provider_name fips

